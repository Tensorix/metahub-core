name: Release Core

# 推送形如 v1.2.3 的 core tag 时自动构建并发布 Release。
# 用法：bun run release（在仓库根，自动读 package.json 版本打 v<ver> 并推送）
#
# 产物（同一个 Release 内）：
#   - CLI 跨平台二进制 + SHA256SUMS.txt（单机交叉编译，ubuntu）
#   - core sidecar 二进制 + SHA256SUMS-sidecars.txt（桌面端自动更新的数据源）
#
# 桌面 App 安装包是独立的 desktop-v* tag → 见 release-desktop.yml。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 Release / 上传产物需要写权限

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 「用 Cloudflare 登录」的公有 OAuth client_id。非机密（PKCE 公有客户端，安全性靠
# 回调白名单 + verifier），但不入库，改由构建时注入：Bun 的 --env 'MH_BUILD_*' 会把
# 所有 MH_BUILD_* 引用内联成字面量，产物因此自带 client_id（用户机器上不存在这个变量）。
# 在仓库 Settings → Secrets and variables → Actions 里配 Variable（或 Secret）
# MH_BUILD_CF_OAUTH_CLIENT_ID；不配则留空 → 编辑器回退到手填 Account ID + API token。
env:
  MH_BUILD_CF_OAUTH_CLIENT_ID: ${{ vars.MH_BUILD_CF_OAUTH_CLIENT_ID || secrets.MH_BUILD_CF_OAUTH_CLIENT_ID }}

jobs:
  # ── 1. 校验 tag 并创建 draft Release（后续 job 往里上传产物）──────────────
  create:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史来判断 tag 是否在 main 上

      # tag 必须指向 main 分支上的提交，否则中止（“main 分支推了 tag”）
      - name: Ensure tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main; refusing to release."
            exit 1
          fi

      # tag 版本必须等于该 commit 树里 package.json 的版本，否则中止。
      # 防止把 tag 打在「还没 bump 版本」的 commit 上 —— 那会让 CI 忠实地构建出
      # 一个内容版本与 tag 名不符的二进制（见此问题的根因）。
      - name: Ensure tag matches package.json version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} → version ${want}, but package.json is ${have}. The tag points at a commit whose version was not bumped; refusing to release."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; reusing it."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --draft
          fi

  # ── 2. CLI 跨平台二进制（单台 ubuntu 交叉编译全部目标）────────────────────
  cli:
    name: CLI binaries
    needs: create
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Build cross-platform binaries
        run: bun run build:binaries

      - name: Checksums
        working-directory: binaries
        run: sha256sum metahub-* > SHA256SUMS.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" binaries/metahub-* binaries/SHA256SUMS.txt --clobber

  # ── 3. core sidecar 二进制（桌面端运行时自动更新的下载源，纯 Bun 单机交叉编译）──
  sidecars:
    name: Core sidecars
    needs: create
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # 纯 Bun，不需要 electron；缺 dist/webui.js 时脚本会自动跑根 build。
      # SIDECAR_ALL=1 → 单机交叉编译全部平台/架构（桌面端自动更新的下载源）。
      - name: Build sidecar binaries
        env:
          SIDECAR_ALL: "1"
        run: bun run apps/desktop/scripts/build-sidecars.ts

      - name: Checksums
        working-directory: apps/desktop/resources
        run: sha256sum metahub-sidecar-* > SHA256SUMS-sidecars.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            apps/desktop/resources/metahub-sidecar-* \
            apps/desktop/resources/SHA256SUMS-sidecars.txt --clobber

  # ── 4. 全部上传成功后，把 draft 转正式发布 ──────────────────────────────
  publish:
    name: Publish release
    needs: [cli, sidecars]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

  # ── 5. 发布到 npm（@tensorix/metahub）──────────────────────────────────
  # 需要 secret NPM_TOKEN（npm automation token）。未配置则跳过、不影响发版。
  # 认证走仓库已提交的 .npmrc（//registry.npmjs.org/:_authToken=${NPM_TOKEN}）。
  publish-npm:
    name: Publish to npm
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Skip if token missing or version already published
        id: guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN 未配置 — 跳过 npm 发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          want="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view @tensorix/metahub@"$want" version 2>/dev/null)" ]; then
            echo "@tensorix/metahub@$want 已在 npm — 跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - if: steps.guard.outputs.skip == 'false'
        run: bun install --frozen-lockfile
      - if: steps.guard.outputs.skip == 'false'
        run: bun run build
      - if: steps.guard.outputs.skip == 'false'
        name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish

  # ── 6. 更新 Homebrew tap 里的 CLI formula（metahub-cli）──────────────────
  # 同 desktop：需要 secret HOMEBREW_TAP_TOKEN（对 homebrew-tap 有 contents:write
  # 的 PAT）。未配置则跳过、不影响发版。
  update-tap:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate formula
        env:
          GH_TOKEN: ${{ github.token }} # 读本仓库 release 的 SHA256SUMS.txt
        run: bun run scripts/gen-formula.ts "${GITHUB_REF_NAME}" metahub-cli.rb

      - name: Push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN 未配置 — 跳过 tap 更新"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Tensorix/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp metahub-cli.rb tap/Formula/metahub-cli.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/metahub-cli.rb
          if git diff --cached --quiet; then
            echo "formula 未变化"
          else
            git commit -m "metahub-cli ${GITHUB_REF_NAME#v}"
            git push
          fi
