name: Release Desktop

# 推送形如 desktop-v1.2.3 的 tag 时打包并发布桌面 App。
# 用法：cd apps/desktop && bun run release（读 apps/desktop/package.json 版本打 desktop-v<ver> 并推送）
#
# electron-builder 无法跨 OS，故每个平台各打各的。打包出的 app 内嵌「该 tag 提交时的
# core」作为离线 fallback；之后 core 更新由 app 运行时从 core Release 自动下载（见 core-updater.ts）。
on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. 校验 tag 并创建 draft Release ──────────────────────────────────────
  create:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main; refusing to release."
            exit 1
          fi

      # tag 版本必须等于该 commit 树里 apps/desktop/package.json 的版本，否则中止。
      # 防止把 desktop-v* tag 打在「还没 bump 版本」的 commit 上。
      - name: Ensure tag matches package.json version
        run: |
          want="${GITHUB_REF_NAME#desktop-v}"
          have="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} → version ${want}, but apps/desktop/package.json is ${have}. The tag points at a commit whose version was not bumped; refusing to release."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; reusing it."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --draft
          fi

  # ── 2. 三 OS 各自打包（dmg/zip、nsis、AppImage/deb）────────────────────────
  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            script: dist:mac
          - os: windows-latest
            platform: win
            script: dist:win
          - os: ubuntu-latest
            platform: linux
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # 让 glob 在 Windows runner 上也走 bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 根依赖（核心库 + WebUI + sidecar 构建），以及 desktop 依赖（electron / electron-builder）
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd apps/desktop

      - name: Package desktop app
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }} # electron-builder 期望存在；--publish never 不会真的发
        run: bun run ${{ matrix.script }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(apps/desktop/release/*.dmg apps/desktop/release/*.zip \
                 apps/desktop/release/*.exe \
                 apps/desktop/release/*.AppImage apps/desktop/release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No desktop artifacts found for ${{ matrix.platform }}"
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber

  # ── 3. 全部上传成功后，把 draft 转正式发布 ──────────────────────────────
  publish:
    name: Publish release
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout here; tell gh which repo
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

  # ── 4. 更新 Homebrew cask（推到独立的 Tensorix/homebrew-tap 仓库）──────────
  # 需要 secret HOMEBREW_TAP_TOKEN：一个对 homebrew-tap 有 contents:write 的 PAT
  # （GITHUB_TOKEN 只能动当前仓库，跨仓库推送必须用 PAT）。未配置则跳过、不影响发版。
  update-tap:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate cask
        env:
          GH_TOKEN: ${{ github.token }} # 读本仓库 release 的 dmg 资产
        run: bun run apps/desktop/scripts/gen-cask.ts "${GITHUB_REF_NAME}" metahub-app.rb

      - name: Push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN 未配置 — 跳过 tap 更新"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Tensorix/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp metahub-app.rb tap/Casks/metahub-app.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/metahub-app.rb
          if git diff --cached --quiet; then
            echo "cask 未变化"
          else
            git commit -m "metahub-app ${GITHUB_REF_NAME#desktop-v}"
            git push
          fi
