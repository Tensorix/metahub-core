<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Metahub</title>
<!--
  Cold-start splash. Self-contained on purpose: it is shown before the Bun
  sidecar (and therefore the WebUI) is up, so it cannot fetch anything — no
  CDN fonts, no external assets. System fonts only, so it paints instantly.
  Palette mirrors src/core/sync/webui.ts; dark/light follow the OS.
-->
<style>
  :root {
    --bg: #ffffff;
    --fg: #2c2c30;
    --muted: #8a8a93;
    --line: #ebebe8;
    --accent: #4a55d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1c;
      --fg: #e6e6e9;
      --muted: #7d7d86;
      --line: #2c2c30;
      --accent: #7b86ff;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    /* select-none + no drag-image; let the whole splash drag the window */
    -webkit-user-select: none;
    user-select: none;
    -webkit-app-region: drag;
    cursor: default;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(74, 85, 214, 0.28);
  }
  .mark svg { display: block; }
  .title {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .spinner {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2.5px solid var(--line);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 1.6s; }
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <path d="M4 18V6l8 5 8-5v12" stroke="#fff" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="title">Metahub</div>
    <div class="spinner" role="status" aria-label="正在启动"></div>
    <div class="hint">正在启动…</div>
  </div>
</body>
</html>
