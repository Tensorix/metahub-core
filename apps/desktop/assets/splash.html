<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Metahub</title>
<!--
  Cold-start splash. Self-contained on purpose: it is shown before the Bun
  sidecar (and therefore the WebUI) is up, so it cannot fetch anything — no
  CDN fonts, no external assets. System fonts only, so it paints instantly.
  Palette mirrors src/core/ui-theme.ts; dark/light follow the OS.
-->
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #37352f;
    --muted: #6f6d66;
    --line: #eae9e6;
    --accent: #3867b2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #191919;
      --fg: #e8e7e4;
      --muted: #aaa8a2;
      --line: #30302f;
      --accent: #8aaddb;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    /* select-none + no drag-image; let the whole splash drag the window */
    -webkit-user-select: none;
    user-select: none;
    -webkit-app-region: drag;
    cursor: default;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .mark {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark img { display: block; width: 56px; height: 56px; }
  .title {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .spinner {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2.5px solid var(--line);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 1.6s; }
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark" aria-hidden="true">
      <img src="brand-icon.png" width="56" height="56" alt="" />
    </div>
    <div class="title">Metahub</div>
    <div class="spinner" role="status" aria-label="正在启动"></div>
    <div class="hint">正在启动…</div>
    <script>try{if(new URLSearchParams(location.search).get('lang')==='en'){document.documentElement.lang='en';document.querySelector('.spinner').setAttribute('aria-label','Starting');document.querySelector('.hint').textContent='Starting…'}}catch(e){}</script>
  </div>
</body>
</html>
