appId: org.tensorix.metahub
productName: Metahub
# Default derives from the scoped npm name (@tensorix/metahub-desktop), whose
# '@' electron-builder 26 rejects as unsafe in file paths. Names the binary
# inside the bundle on every platform and the deb's /usr/bin symlink.
executableName: metahub-desktop
copyright: Copyright © Tensorix

# We never use electron-updater (the shell is updated manually; core updates via
# core-updater.ts). But electron-builder still needs a publish provider to
# compute update-channel metadata during packaging — without it, zip/deb targets
# crash in computeChannelNames. The actual upload is done by `gh` in CI, so the
# scripts pass `--publish never` and this is never used to upload.
publish:
  provider: github
  owner: Tensorix
  repo: metahub-core

directories:
  output: release
  buildResources: build # build/icon.png → auto-derived icns/ico/png

# Register Metahub as an "open with" handler for Markdown/plain-text files.
# rank Alternate: appears in the打开方式 list without claiming default-handler
# status. Opened files land in the standalone file-editor window (see
# openFileWindow in src/main.ts). NB: the mac app is unsigned (identity: null),
# so Launch Services may need a reinstall/lsregister pass to pick this up.
fileAssociations:
  - ext: [md, markdown]
    name: Markdown
    role: Editor
    rank: Alternate
  - ext: [txt]
    name: Plain Text
    role: Editor
    rank: Alternate

# Only the Electron shell goes inside the app bundle. The sidecar is a separate
# self-contained binary shipped via extraResources (see below). The WebUI is
# embedded in the sidecar binary, served over loopback HTTP — not bundled here.
# Exception: dist/file-editor.{html,js,css} (the disk-loaded .md/.txt editor
# shell, built by scripts/build-file-editor.ts) rides the asar so file windows
# open without waiting for the sidecar.
files:
  - dist/**/*
  - assets/**/*
  - package.json
asar: true

# Consistent, arch-explicit dmg names (default leaves x64 without an arch tag).
# The Homebrew cask is generated from whatever the release actually contains
# (see scripts/gen-cask.ts), so this is just for clarity going forward.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  identity: null # ad-hoc: unsigned / not notarized for now
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  extraResources:
    - from: resources/metahub-sidecar-mac-${arch}
      to: metahub-sidecar

# One installer per arch (default merges all archs into one double-sized
# "universal" exe). Keeps names arch-explicit, same policy as dmg above.
nsis:
  buildUniversalInstaller: false
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  extraResources:
    - from: resources/metahub-sidecar-win-${arch}.exe
      to: metahub-sidecar.exe

linux:
  category: Utility
  maintainer: Tensorix <noahc1510@gmail.com>
  # Without this the deb uses the scoped npm name (@tensorix/metahub-desktop),
  # producing a path with a slash. Keep artifact names flat and clean.
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Install the .desktop file under the same name Electron reports as app_id /
  # WM_CLASS (desktopName in package.json), so DEs associate running windows
  # with the launcher entry.
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  extraResources:
    - from: resources/metahub-sidecar-linux-${arch}
      to: metahub-sidecar
