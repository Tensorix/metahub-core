appId: org.tensorix.metahub
productName: Metahub
copyright: Copyright © Tensorix

# We never use electron-updater (the shell is updated manually; core updates via
# core-updater.ts). But electron-builder still needs a publish provider to
# compute update-channel metadata during packaging — without it, zip/deb targets
# crash in computeChannelNames. The actual upload is done by `gh` in CI, so the
# scripts pass `--publish never` and this is never used to upload.
publish:
  provider: github
  owner: Tensorix
  repo: metahub-core

directories:
  output: release
  buildResources: build # build/icon.png → auto-derived icns/ico/png

# Only the Electron shell goes inside the app bundle. The sidecar is a separate
# self-contained binary shipped via extraResources (see below). The WebUI is
# embedded in the sidecar binary, served over loopback HTTP — not bundled here.
files:
  - dist/**/*
  - assets/**/*
  - package.json
asar: true

mac:
  category: public.app-category.productivity
  identity: null # ad-hoc: unsigned / not notarized for now
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  extraResources:
    - from: resources/metahub-sidecar-mac-${arch}
      to: metahub-sidecar

win:
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: resources/metahub-sidecar-win-x64.exe
      to: metahub-sidecar.exe

linux:
  category: Utility
  maintainer: Tensorix <noahc1510@gmail.com>
  # Without this the deb uses the scoped npm name (@tensorix/metahub-desktop),
  # producing a path with a slash. Keep artifact names flat and clean.
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  extraResources:
    - from: resources/metahub-sidecar-linux-x64
      to: metahub-sidecar
